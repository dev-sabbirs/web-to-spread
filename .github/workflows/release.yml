name: Auto Release Extension Dist Zip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Chrome Extension
        run: bun run build

      - name: Determine & Increment Version
        id: versioning
        run: |
          # Read current version from package.json
          CURRENT_VERSION=$(jq -r '.version' package.json)
          
          # Extract major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$NEW_VERSION" >> $GITHUB_ENV

          # Update package.json version
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Create Extension Dist Zip
        run: |
          cd dist
          zip -r "../web-to-spread-${{ env.TAG_NAME }}.zip" .
          cd ..

      - name: Extract Commit Messages for Release Body
        id: release_notes
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "## 📦 Release ${{ env.TAG_NAME }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### 📝 Commits in this release:" >> $GITHUB_ENV
          git log -n 10 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Commit Version Bump to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ env.TAG_NAME }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release with Dist Zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: web-to-spread-${{ env.TAG_NAME }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
